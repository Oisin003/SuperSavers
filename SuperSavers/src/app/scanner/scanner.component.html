<div class="scanner-card">
  <h3>Add Product Manually</h3>

  <div class="form-row">
    <label># (Product ID)</label>
    <input type="number" [(ngModel)]="productId" placeholder="Enter unique product number (e.g., 90)" min="1" />
  </div>

  <div class="form-row">
    <label>List</label>
    <select [(ngModel)]="list">
      <option *ngFor="let c of categories" [value]="c">{{c}}</option>
    </select>
  </div>

  <div class="form-row">
    <label>Description</label>
    <input [(ngModel)]="description" placeholder="Enter product description" />
  </div>

  <div class="form-row">
    <label>Price (£)</label>
    <input type="number" [(ngModel)]="price" placeholder="0.00" step="0.01" min="0" />
  </div>

  <div class="form-row">
    <label>Sold As</label>
    <input type="number" [(ngModel)]="soldAs" min="1" />
  </div>

  <div class="form-row">
    <label>Stock</label>
    <input type="number" [(ngModel)]="stock" placeholder="0" min="0" />
  </div>

  <div class="form-row">
    <button (click)="onAddProduct()">Add Product</button>
  </div>

  <div class="result" *ngIf="message">{{message}}</div>

  <div *ngIf="result" class="product-details">
    <h4>Product Added</h4>
    <table>
      <tr><td>#</td><td>{{result.id}}</td></tr>
      <tr><td>Description</td><td>{{result.description}}</td></tr>
      <tr><td>Category</td><td>{{result.category}}</td></tr>
      <tr><td>Price</td><td>£{{result.price.toFixed(2)}}</td></tr>
      <tr><td>Sold As</td><td>{{result.packSize}}</td></tr>
      <tr><td>Stock</td><td>{{result.quantity}}</td></tr>
    </table>
  </div>
</div>
